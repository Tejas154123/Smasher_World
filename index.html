<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smasher World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <main class="portfolio-grid">
            <section class="left-column">
                <div class="card-smasher-world brutal-shadow">
                    <img
                        id="avatar"
                        src="avatar.jpeg"
                        alt="Smasher Guy Avatar"
                    />
                </div>
                <div class="info-row">
                    <span class="info labal">Age</span>
                    <div class="arrow-line"><span>───────────&gt;</span></div>
                    <span class="info-value">15</span>
                </div>
                <div class="info-row">
                    <span class="info-label">REAL NAME</span>
                     <div class="arrow-line"><span>───────&gt;</span></div>
                    <span class="info-value">NA</span>
                </div>
            </section>
        </main>
    </div>
    
</body>
</html>
